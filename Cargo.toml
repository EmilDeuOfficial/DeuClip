[package]
name = "deuclip"
version = "1.0.0"
edition = "2021"
build = "build.rs"
description = "Instant-Replay-Clip-Tool fuer Windows, geschrieben in Rust"
license = "MIT"
repository = "https://github.com/EmilDeuOfficial/DeuClip"
readme = "README.md"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts"] }
global-hotkey = "0.10"
rfd = { version = "0.18", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
directories = "6"
log = { version = "0.4", features = ["std"] }
winreg = "0.56"
tray-icon = { version = "0.26", default-features = false }
windows = { version = "0.62", features = [
    "Foundation",
    "Data_Xml_Dom",
    "UI_Notifications",
    "Win32_Foundation",
    "Win32_Devices_Display",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_Threading",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_WinRT",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
